server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    etag on;

    location = /_headers {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
}
